<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>快速找教室 · 校园生活工具站</title>
<link rel="stylesheet" href="css/style.css">
<style>
  :root{
    --ink:#141a17; --muted:#5b6762; --line:#e0e6e2;
    --accent:#0f766e; --accent-soft:#e4f3ef;
    --bg:#f6f8f7; --card:#ffffff;
    --route:#e2453c;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  /* 与站点其它页面一致的顶栏 */
  .sitebar{background:#fff;border-bottom:1px solid var(--line);}
  .sitebar-inner{
    max-width:1560px;margin:0 auto;padding:10px 20px;
    display:flex;align-items:center;justify-content:space-between;gap:10px 20px;flex-wrap:wrap;
  }
  .sbrand{display:inline-flex;align-items:center;gap:9px;color:var(--ink);font-size:14px;font-weight:600;text-decoration:none;}
  .sbrand-mark{
    display:grid;place-items:center;width:28px;height:28px;flex:0 0 auto;
    border:1px solid #c9d3ce;border-radius:8px;background:#eef3f1;color:#0a5a54;
  }
  .sbrand-mark svg{width:17px;height:17px;}
  .snav{display:flex;flex-wrap:wrap;gap:2px;}
  .snav a{padding:7px 11px;border-radius:8px;color:var(--muted);font-size:13.5px;font-weight:600;text-decoration:none;}
  .snav a:hover{background:#eef3f1;color:var(--ink);}
  .snav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);}

  header.appbar{
    position:sticky; top:0; z-index:30;
    background:rgba(255,255,255,.92); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .hdr{
    max-width:1560px; margin:0 auto; padding:12px 20px;
    display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .logo{
    width:34px;height:34px;border-radius:10px;background:var(--accent);
    display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px;
    box-shadow:0 4px 10px rgba(15,118,110,.22);
  }
  .brand h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.5px;}
  .brand p{margin:0;font-size:11px;color:var(--muted);letter-spacing:.3px;}
  .searchwrap{position:relative;flex:1 1 260px;min-width:0;max-width:460px;margin-left:auto;}
  .searchwrap input{
    width:100%;padding:10px 14px 10px 38px;border-radius:12px;border:1px solid var(--line);
    background:#f7f9f8;font-size:13.5px;outline:none;font-family:inherit;color:var(--ink);
    transition:.18s;
  }
  .searchwrap input:focus{background:#fff;border-color:var(--accent);box-shadow:0 0 0 3px rgba(15,118,110,.10);}
  .searchwrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.45;}
  .results{
    position:absolute;top:calc(100% + 6px);left:0;right:0;background:#fff;border:1px solid var(--line);
    border-radius:12px;box-shadow:0 16px 40px rgba(20,40,35,.14);overflow:hidden;display:none;z-index:50;
  }
  .results.show{display:block;}
  .result{
    padding:9px 12px;font-size:13px;display:flex;gap:8px;align-items:baseline;cursor:pointer;
    border-bottom:1px solid #f2f5f3;
  }
  .result:last-child{border-bottom:none;}
  .result:hover,.result.active{background:var(--accent-soft);}
  .result b{font-weight:700;}
  .result span{color:var(--muted);font-size:11.5px;}
  .result .bld{margin-left:auto;color:var(--accent);font-size:11px;white-space:nowrap;}

  .wrap{max-width:1560px;margin:0 auto;padding:16px 20px 40px;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start;}
  .main{min-width:0;}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
  .tab{
    border:1px solid var(--line);background:#fff;color:var(--ink);
    padding:9px 16px;border-radius:12px;font-size:13.5px;cursor:pointer;font-family:inherit;
    display:flex;align-items:center;gap:8px;transition:.16s;font-weight:600;
  }
  .tab:hover{border-color:#c9d8d3;transform:translateY(-1px);}
  .tab.active{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 6px 16px rgba(15,118,110,.20);}
  .tab .dot{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.6;}
  .tab em{font-style:normal;font-weight:400;font-size:11px;opacity:.75;}

  .floorbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 10px;min-height:34px;}
  .floorbar .lbl{font-size:12px;color:var(--muted);margin-right:4px;}
  .chip{
    min-width:38px;height:30px;padding:0 10px;border-radius:9px;border:1px solid var(--line);
    background:#fff;font-size:12.5px;cursor:pointer;font-family:inherit;color:var(--ink);font-weight:600;
  }
  .chip:hover{border-color:#c9d8d3;}
  .chip.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .chip.back{color:var(--accent);font-weight:700;}
  .chip.dim{opacity:.35;cursor:not-allowed;}

  .stage{
    background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:10px 12px;box-shadow:0 1px 2px rgba(20,40,35,.04),0 12px 30px rgba(20,40,35,.05);
    position:relative;overflow:hidden;
  }
  .stage svg{display:block;width:100%;height:auto;touch-action:manipulation;}
  .hint{
    position:absolute;left:16px;bottom:12px;font-size:11px;color:var(--muted);
    background:rgba(255,255,255,.9);padding:4px 9px;border-radius:8px;border:1px solid var(--line);
  }

  .side{display:flex;flex-direction:column;gap:14px;position:sticky;top:80px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 15px;box-shadow:0 1px 2px rgba(20,40,35,.04);}
  .card h3{margin:0 0 10px;font-size:13px;letter-spacing:.4px;display:flex;align-items:center;gap:7px;}
  .card h3 .bar{width:3px;height:13px;border-radius:2px;background:var(--accent);}
  .card .sub{font-size:11.5px;color:var(--muted);line-height:1.6;margin:-2px 0 10px;}

  .startrow{display:flex;gap:6px;flex-wrap:wrap;}
  .startbtn{
    border:1px solid var(--line);background:#f8faf9;border-radius:9px;padding:6px 10px;
    font-size:12px;cursor:pointer;font-family:inherit;color:var(--ink);
  }
  .startbtn.active{background:var(--accent-soft);border-color:#b9d8cf;color:#1d5a4e;font-weight:700;}

  .empty{font-size:12.5px;color:var(--muted);line-height:1.7;}
  .empty b{color:var(--ink);}

  .routeinfo .target{font-size:15px;font-weight:700;display:flex;align-items:center;gap:6px;margin-bottom:2px;}
  .routeinfo .where{font-size:11.5px;color:var(--muted);margin-bottom:10px;}
  .steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px;}
  .steps li{display:flex;gap:9px;font-size:12.3px;line-height:1.55;}
  .steps .n{
    flex:0 0 19px;height:19px;border-radius:50%;background:var(--accent-soft);color:#1d5a4e;
    font-size:11px;display:grid;place-items:center;font-weight:700;margin-top:1px;
  }
  .sum{
    margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);
    display:flex;justify-content:space-between;font-size:12px;color:var(--muted);
  }
  .sum b{color:var(--ink);font-size:14px;}

  .legend{display:flex;flex-wrap:wrap;gap:6px 12px;}
  .lg{display:flex;align-items:center;gap:5px;font-size:11px;color:#4a5b57;}
  .sw{width:12px;height:12px;border-radius:3px;border:1px solid;}
  .notes{font-size:10.5px;color:var(--muted);line-height:1.7;margin-top:10px;border-top:1px dashed var(--line);padding-top:8px;}

  /* svg */
  .room{cursor:pointer;transition:filter .12s;}
  .room:hover{filter:brightness(.965);}
  .room.sel{stroke:#e2453c !important;stroke-width:2.6 !important;filter:drop-shadow(0 0 5px rgba(226,69,60,.35));}
  .bldg{cursor:pointer;}
  .bldg:hover .bshape{stroke:var(--accent);stroke-width:4;}
  .route{fill:none;stroke:var(--route);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:10 8;animation:dash 1.1s linear infinite;filter:drop-shadow(0 1px 2px rgba(226,69,60,.28));}
  @keyframes dash{to{stroke-dashoffset:-36;}}
  .pin{animation:pulse 1.8s ease-out infinite;}
  @keyframes pulse{0%{r:6;opacity:.9}70%{r:15;opacity:0}100%{r:15;opacity:0}}
  .lbl{font-family:inherit;pointer-events:none;user-select:none;}
  .tiny{font-family:inherit;pointer-events:none;}

  @media (max-width:1080px){
    .wrap{grid-template-columns:1fr;padding:12px;}
    .side{position:static;flex-direction:row;flex-wrap:wrap;}
    .side .card{flex:1 1 300px;}
    .searchwrap{max-width:none;}
  }
  @media (max-width:640px){
    .-inner{padding:9px 14px;}
    .snav a{padding:6px 8px;font-size:13px;}
    .hdr{padding:10px 14px;gap:10px 12px;}
    .brand{flex:1 1 100%;min-width:0;}
    .brand h1{font-size:15px;}
    .searchwrap{flex:1 1 100%;min-width:0;max-width:none;margin-left:0;}
    .wrap{padding:12px 12px 32px;gap:12px;}
    .stage{padding:8px;}
    .tabs{gap:6px;}
    .tab{padding:8px 12px;font-size:13px;}
    .side{flex-direction:column;}
    .side .card{flex:1 1 auto;}
  }
</style>
</head>
<body>

      <a class="brand" href="index.html">← 返回首页</a>
    </div>

      </svg>
      <input id="q" type="text" placeholder="搜索教室 / 房间号，例如 305、精诚楼201、国防楼111" autocomplete="off">

</header>

<div class="wrap">

    <div class="floorbar" id="floorbar"></div>

    </div>
  </main>

  <aside class="side">
    <section class="card">
      <h3><span class="bar"></span>从这里出发</h3>

      <div class="startrow" id="startrow"></div>
    </section>

    <section class="card" id="routecard">
      <h3><span class="bar"></span>路线指引</h3>
      <div id="routebody">
        <div class="empty">还没有选择目的地。<br>试试搜索 <b>305</b>，或直接点击平面图上的房间。</div>
      </div>
    </section>

    <section class="card">
      <h3><span class="bar"></span>图例</h3>
      <div class="legend" id="legend"></div>
      <div class="notes">
        平面图按原图房间相对位置抽象绘制，非精确比例；楼梯、电梯位置为示意。<br>
        实线为墙、不可穿行，实际通行以现场为准。
      </div>
    </section>
  </aside>
</div>

const NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('map');
const $ = (s) => document.querySelector(s);

function E(tag, attrs, parent){
  const n = document.createElementNS(NS, tag);
  if (attrs) for (const k in attrs){
    if (attrs[k] === null || attrs[k] === undefined) continue;
    n.setAttribute(k, attrs[k]);
  }
  if (parent) parent.appendChild(n);
  return n;
}
function txt(parent, x, y, s, opts = {}){
  const t = E('text', {
    x, y,
    'text-anchor': opts.anchor || 'middle',
    'font-size': opts.size || 12,
    'font-weight': opts.weight || 500,
    fill: opts.fill || '#20302d',
    'dominant-baseline': opts.baseline || 'middle',
    class: opts.cls || 'lbl'
  }, parent);
  t.textContent = s;
  return t;
}

/* 行 / 列 排布工具 */
function row(y, h, items, x0, x1, gap = 4){
  const sum = items.reduce((a, b) => a + (b[3] || 1), 0);
  const W = (x1 - x0) - gap * (items.length - 1);
  let x = x0;
  return items.map(it => {
    const w = W * (it[3] || 1) / sum;
    const r = { id: it[0], label: it[1], type: it[2], x, y, w, h };
    x += w + gap;
    return r;
  });
}
function col(x, w, items, y0, y1, gap = 4){
  const sum = items.reduce((a, b) => a + (b[3] || 1), 0);
  const H = (y1 - y0) - gap * (items.length - 1);
  let y = y0;
  return items.map(it => {
    const h = H * (it[3] || 1) / sum;
    const r = { id: it[0], label: it[1], type: it[2], x, y, w, h };
    y += h + gap;
    return r;
  });
}
const room = (id, label, type, x, y, w, h, extra) => Object.assign({ id, label, type, x, y, w, h }, extra || {});

function drawCampus(){

  // 道路

  roadLbl.setAttribute('transform','translate(500,150) rotate(90)');

  // 建筑
  CAMPUS.buildings.filter(b=>b.kind!=='ground').forEach(b=>{

    const isReal = !!BUILDINGS[b.key];

      class:'bshape', x:b.x, y:b.y, width:b.w, height:b.h, rx:18,
      fill, stroke, 'stroke-width':3, filter:'url(#soft)'
    }, g);
    if (b.small){
      const lines = b.label.match(/.{1,4}/g) || [b.label];
      lines.forEach((ln,i)=>txt(g, b.x+b.w/2, b.y+b.h/2 + (i-(lines.length-1)/2)*16, ln, { size:11.5, weight:600 }));
    } else {
      txt(g, b.x+b.w/2, b.y+b.h/2 - (b.alias?4:0), b.label, { size:16, weight:700 });

    }
    // 入口点
    if (b.entrance && isReal){
      const ex = b.entrance[0], ey = b.entrance[1];

  E('line', { x1:136, y1:658, x2:136, y2:670, stroke:'#8aa09a', 'stroke-width':3 }, svg);
  txt(svg, 86, 678, '约 40 m', { size:10, fill:'#8aa09a' });
}
function ptsToPath(pts){
  return pts.map((p,i)=> (i? 'L':'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
}

function roomFullName(r){
  const id = r.id || '', lab = r.label || '';
  if (!lab) return id;
  if (!id || /^[a-zA-Z]/.test(id)) return lab;
  if (lab.startsWith(id)) return lab;
  if (/^\d+[A-Za-z-]/.test(id)) return lab;
  return id + ' ' + lab;
}

function drawRoomLabel(g, r, t, sel){
  const name = roomFullName(r);
  if (!name) return;
  // 中文按 1 字宽、英文数字按 0.55 字宽估算，避免标签溢出
  const est = s => [...s].reduce((a,ch)=> a + (/[\x00-\xff]/.test(ch) ? 0.55 : 1), 0);
  const vertical = r.vertical || (r.w < 56 && r.h > 52);
  const cx = r.x + r.w/2, cy = r.y + r.h/2;

  let lines;
  if (r.id && r.label && r.label !== r.id && !/^[a-zA-Z]/.test(r.id) && r.w > 62 && r.h >= 46){
    lines = [r.id, r.label];
  } else {
    lines = [name];
  }

  if (vertical){
    const fs = Math.min(12, Math.max(7.6, (r.h - 8) / Math.max(2, est(name) * 1.02)));
    const el = E('text', {
      x:cx, y:cy, 'text-anchor':'middle', 'dominant-baseline':'middle',
      'font-size':fs, 'font-weight':600, fill:t.t, class:'lbl',
      transform:`rotate(-90 ${cx} ${cy})`
    }, g);
    el.textContent = name;
    return;
  }

  const longest = Math.max(...lines.map(est));
  let fs = Math.min(13.5, (r.w - 7) / Math.max(2.2, longest * 0.98), (r.h - 6) / (lines.length * 1.45 + 0.3));
  fs = Math.max(7.4, fs);

  if (fs < 8.2 && lines.length > 1){
    lines = [r.id];
    fs = Math.max(7.6, Math.min(11, (r.w-6)/ (est(r.id)*0.98)));
  }

  lines.forEach((ln, i)=>{
    const y = cy + (i - (lines.length-1)/2) * (fs * 1.32);
    const el = E('text', {
      x:cx, y, 'text-anchor':'middle', 'dominant-baseline':'middle',
      'font-size': i===0 && lines.length>1 ? fs*1.02 : fs,
      'font-weight': i===0 ? 700 : 500,
      fill: i===0 ? t.t : t.t, class:'lbl'
    }, g);
    el.textContent = ln;
  });
}

/* ============================================================
   图修
   ============================================================ */
function buildGraph(polys){
  const nodes = [], adj = [], idx = new Map(), eset = new Set();
  const keyOf = p => p[0].toFixed(1) + ',' + p[1].toFixed(1);
  function add(p){
    const k = keyOf(p);
    if (idx.has(k)) return idx.get(k);
    const i = nodes.length;
    nodes.push([+p[0], +p[1]]); adj.push([]); idx.set(k, i);
    return i;
  }
  function link(a, b){
    if (a === b || a === null || b === null) return;
    const ek = Math.min(a,b) + '-' + Math.max(a,b);
    if (eset.has(ek)) return;
    eset.add(ek);
    const d = Math.hypot(nodes[a][0]-nodes[b][0], nodes[a][1]-nodes[b][1]);
    adj[a].push([b, d]); adj[b].push([a, d]);
  }
  const segs = [];
  polys.forEach(pl=>{
    const ids = pl.map(add);
    for (let i=0;i<ids.length-1;i++){ link(ids[i], ids[i+1]); segs.push([ids[i], ids[i+1]]); }
  });

  // 交叉的走廊自动打节点，保证连通
  function cross(p1,p2,p3,p4){
    const d = (p2[0]-p1[0])*(p4[1]-p3[1]) - (p2[1]-p1[1])*(p4[0]-p3[0]);
    if (Math.abs(d) < 1e-9) return null;
    const t = ((p3[0]-p1[0])*(p4[1]-p3[1]) - (p3[1]-p1[1])*(p4[0]-p3[0])) / d;
    const u = ((p3[0]-p1[0])*(p2[1]-p1[1]) - (p3[1]-p1[1])*(p2[0]-p1[0])) / d;
    if (t < -0.001 || t > 1.001 || u < -0.001 || u > 1.001) return null;
    return [p1[0]+t*(p2[0]-p1[0]), p1[1]+t*(p2[1]-p1[1])];
  }
  for (let i=0;i<segs.length;i++){
    for (let j=i+1;j<segs.length;j++){
      const [a1,b1] = segs[i], [a2,b2] = segs[j];
      if (a1===a2 || a1===b2 || b1===a2 || b1===b2) continue;
      const q = cross(nodes[a1], nodes[b1], nodes[a2], nodes[b2]);
      if (q){
        const k = add(q);
        link(k, a1); link(k, b1); link(k, a2); link(k, b2);
      }
    }
  }

  function attach(p){
    let best = { d: Infinity, a:null, b:null, q:null };
    const seen = new Set();
    for (let a=0;a<adj.length;a++){
      for (const [b] of adj[a]){
        const kk = Math.min(a,b)+'-'+Math.max(a,b);
        if (seen.has(kk)) continue;
        seen.add(kk);
        const A = nodes[a], B = nodes[b];
        const vx = B[0]-A[0], vy = B[1]-A[1];
        const L2 = vx*vx + vy*vy || 1;
        let t = ((p[0]-A[0])*vx + (p[1]-A[1])*vy) / L2;
        t = Math.max(0, Math.min(1, t));
        const q = [A[0]+vx*t, A[1]+vy*t];
        const d = Math.hypot(p[0]-q[0], p[1]-q[1]);
        if (d < best.d) best = { d, a, b, q };
      }
    }
    if (!best.q) return null;
    const i = add(best.q);
    link(i, best.a); link(i, best.b);
    return i;
  }
  function dijkstra(a, b){
    if (a === null || b === null) return null;
    const n = nodes.length;
    const dist = new Array(n).fill(Infinity);
    const prev = new Array(n).fill(-1);
    const done = new Array(n).fill(false);
    dist[a] = 0;
    for (let it=0; it<n; it++){
      let u = -1, best = Infinity;
      for (let i=0;i<n;i++) if (!done[i] && dist[i] < best){ best = dist[i]; u = i; }
      if (u < 0) break;
      if (u === b) break;
      done[u] = true;
      for (const [v,w] of adj[u]){
        if (dist[u] + w < dist[v]){ dist[v] = dist[u] + w; prev[v] = u; }
      }
    }
    if (dist[b] === Infinity) return null;
    const pts = [];
    let c = b;
    while (c !== -1){ pts.push(nodes[c]); c = prev[c]; }
    pts.reverse();
    return { points: pts, dist: dist[b] };
  }
  return { nodes, adj, attach, dijkstra };
}

const graphCache = new Map();
function getFloorGraph(bId, floorIdx){
  const key = bId + ':' + floorIdx;
  if (graphCache.has(key)) return graphCache.get(key);
  const f = BUILDINGS[bId].floors[floorIdx];
  const g = buildGraph(f.corridors);
  (f.stairs || []).forEach(s => { if (s._n === undefined) s._n = g.attach([s.x, s.y]); });
  (f.entrances || []).forEach(e => { if (e._n === undefined) e._n = g.attach([e.x, e.y]); });
  graphCache.set(key, g);
  return g;
}

const campusGraph = buildGraph([
  [[500,660],[500,610],[500,537],[500,475],[500,413],[500,343],[500,250],[500,191],[500,14]],
  [[500,610],[761,610],[761,537]],
  [[500,343],[643,343]],
  [[500,413],[527,413]],
  [[500,413],[312,414]],
  [[500,191],[300,191]],
  [[500,191],[790,193]],
  [[500,250],[130,250]]
]);

function campusRoute(startPt, endPt){
  const g = campusGraph;
  const a = g.attach(startPt), b = g.attach(endPt);
  return g.dijkstra(a, b);
}

const centerOf = r => [r.x + r.w/2, r.y + r.h/2];
const doorOf = (pts, r) => {
  const p = pts[pts.length-1];
  return [Math.max(r.x+2, Math.min(p[0], r.x+r.w-2)), Math.max(r.y+2, Math.min(p[1], r.y+r.h-2))];
};
const gapToRoom = (pts, r) => {
  const d = doorOf(pts, r), p = pts[pts.length-1];
  return Math.hypot(d[0]-p[0], d[1]-p[1]);
};
const intoRoom = (pts, r) => pts.concat([doorOf(pts, r)]);

function planRoute(bId, floorIdx, roomId, startId){
  const b = BUILDINGS[bId];
  const f = b.floors[floorIdx];
  const rm = f.rooms.find(r => r.id === roomId);
  if (!rm) return null;
  const start = START_POINTS[startId];

  let campus = null;
  if (start && start.pt){
    const cr = campusRoute(start.pt, b.campusEntrance);
    if (cr) campus = { points: cr.points, dist: cr.dist };
  }

  // 选择入口
  const f1 = b.floors[0];
  let entrance = (f1.entrances || []).find(e => e.main) || (f1.entrances || [])[0];
  if (startId === 'gate-n') {
    const north = (f1.entrances || []).find(e => /北/.test(e.label));
    if (north) entrance = north;
  }
  if (!entrance) return null;

  const legs = [];
  let stair = null;

  if (floorIdx === 0){
    const g = getFloorGraph(bId, 0);
    const p = g.dijkstra(g.attach([entrance.x, entrance.y]), g.attach(centerOf(rm)));
    if (p) legs.push({ floor:0, points: intoRoom(p.points, rm), dist: p.dist + gapToRoom(p.points, rm) });
  } else {
    let best = null;
    for (const s of f.stairs){
      const s1 = (f1.stairs || []).find(x => x.id === s.id);
      if (!s1) continue;
      const g1 = getFloorGraph(bId, 0), g2 = getFloorGraph(bId, floorIdx);
      const p1 = g1.dijkstra(g1.attach([entrance.x, entrance.y]), s1._n);
      const p2 = g2.dijkstra(s._n, g2.attach(centerOf(rm)));
      if (!p1 || !p2) continue;
      const d = p1.dist + p2.dist + gapToRoom(p2.points, rm);
      if (!best || d < best.d) best = { d, s, p1, p2 };
    }
    if (best){
      legs.push({ floor:0, points:best.p1.points, dist:best.p1.dist });
      legs.push({ floor:floorIdx, points: intoRoom(best.p2.points, rm), dist: best.p2.dist + gapToRoom(best.p2.points, rm) });
      stair = best.s;
    }
  }

  const campusMeters = campus ? campus.dist * 0.4 : 0;
  const floorMeters = legs.reduce((a,l)=>a+l.dist, 0) * 0.075;
  const total = campusMeters + floorMeters;
  const minutes = Math.max(1, Math.round(total / 1.25 / 60 * 10) / 10);

  return {
    bId, floorIdx, roomId: rm.id,
    campus, legs, stair,
    entrance, start,
    total, minutes,
    room: rm
  };
}

   ============================================================ */
function openBuilding(key){
  S.view = key;
  S.floor = 0;
  S.selected = null;
  S.route = null;
  try { history.pushState({ view:key }, '', '#' + key); } catch(e){}
  render();
  window.scrollTo({ top:0, behavior:'smooth' });
}

function openCampus(){
  // 有历史记录时交给返回键处理，避免手机返回直接退出整站
  if (history.state && history.state.view){
    history.back();
    return;
  }
  S.view = 'campus';
  S.floor = 0;
  render();
  window.scrollTo({ top:0, behavior:'smooth' });
}

window.addEventListener('popstate', ()=>{
  if (S.view !== 'campus'){
    S.view = 'campus';
    S.floor = 0;
    render();
    window.scrollTo({ top:0, behavior:'smooth' });
  }
});

function selectRoom(bId, floorIdx, roomId){
  S.selected = { bId, floor: floorIdx, roomId };
  S.route = planRoute(bId, floorIdx, roomId, S.start);
  renderRoutePanel();
  // 只重绘当前视图
  if (S.view === 'campus'){ drawCampus(); }
  else { drawFloor(); }
  // 高亮
  const f = BUILDINGS[bId].floors[floorIdx];
  const rm = f.rooms.find(r => r.id === roomId);
  if (rm){
    const sel = planRoute(bId, floorIdx, roomId, S.start);
    S.route = sel;
  }
}

function recomputeRoute(){
  if (!S.selected) return;
  S.route = planRoute(S.selected.bId, S.selected.floor, S.selected.roomId, S.start);
}

function renderRoutePanel(){
  const el = $('#routebody');
  if (!S.route){
    el.innerHTML = `<div class="empty">还没有选择目的地。<br>试试搜索 <b>305</b>，或直接点击平面图上的房间。</div>`;
    return;
  }
  const r = S.route;
  const b = BUILDINGS[r.bId];
  const f = b.floors[r.floorIdx];
  const name = roomFullName(r.room);

  const steps = [];
  if (r.campus && r.start && r.start.pt){
    const meters = Math.round(r.campus.dist * 0.4 / 5) * 5;
    steps.push(`从 <b>${r.start.name}</b> 出发，沿校园道路步行约 ${meters} 米，到达 <b>${b.name}${r.entrance.label}</b>。`);
  } else if (r.start && !r.start.pt){
    steps.push(`从 <b>${b.name}${r.entrance.label}</b> 进入（仅显示楼内路线）。`);
  } else {
    steps.push(`从 <b>${b.name}${r.entrance.label}</b> 进入。`);
  }

  if (r.floorIdx === 0){
    const leg0 = r.legs.find(l=>l.floor===0);
    const m = Math.round((leg0?.dist || 0) * 0.075);
    steps.push(`进入后沿一层走廊步行约 ${m} 米，到达 <b>${name}</b>。`);
  } else {
    const st = r.stair || { label:'楼梯' };
    const leg0 = r.legs.find(l=>l.floor===0);
    const m1 = Math.round((leg0?.dist || 0) * 0.075);
    steps.push(`进入后沿一层走廊步行约 ${m1} 米，找到 <b>${st.label}</b>，${st.kind==='lift'?'乘电梯':'沿楼梯'}上至 <b>${f.level} 层</b>。`);
    const m2 = Math.round((r.legs.find(l=>l.floor===r.floorIdx)?.dist || 0) * 0.075);
    steps.push(`出${st.label}后沿走廊步行约 ${m2} 米，到达 <b>${name}</b>。`);
  }

  el.innerHTML = `
    <div class="routeinfo">
      <div class="target">${name}</div>
      <div class="where">${b.name} · ${f.level}F ${b.alias?`（原${b.alias}）`:''}</div>
      <ol class="steps">
        ${steps.map((s,i)=>`<li><span class="n">${i+1}</span><div>${s}</div></li>`).join('')}
      </ol>
      <div class="sum">
        <span>全程约 <b>${Math.round(r.total/5)*5} m</b></span>
        <span>步行约 <b>${r.minutes}</b> 分钟</span>
      </div>
    </div>`;
}

const INDEX = [];
Object.values(BUILDINGS).forEach(b=>{
  b.floors.forEach((f, fi)=>{
    f.rooms.forEach(r=>{
      if (!r.id || /^[a-zA-Z]/.test(r.id) || r.type === 'hall' || r.type === 'atrium') return;
      INDEX.push({
        bId:b.key, floor:fi, roomId:r.id, r,
        text: `${b.name} ${b.alias || ''} ${r.id} ${r.label}`,
        label: roomFullName(r),
        where: `${b.name} · ${f.level}F`
      });
    });
  });
});

const qEl = $('#q'), resEl = $('#results');
let activeResult = -1;
function doSearch(q){
  const s = q.trim();
  if (!s){ resEl.classList.remove('show'); return; }
  const norm = s.replace(/\s+/g,'').toLowerCase();
  let hits = INDEX.filter(it => it.text.replace(/\s+/g,'').toLowerCase().includes(norm));
  // 优先房间号完全匹配
  hits.sort((a,b)=>{
    const ea = a.roomId.toLowerCase() === norm ? 0 : (a.roomId.toLowerCase().startsWith(norm) ? 1 : 2);
    const eb = b.roomId.toLowerCase() === norm ? 0 : (b.roomId.toLowerCase().startsWith(norm) ? 1 : 2);
    return ea - eb;
  });
  hits = hits.slice(0, 8);
  if (!hits.length){
    resEl.innerHTML = `<div class="result"><span>没有找到“${s}”，试试 305 / 精诚楼201 / 国防楼111</span></div>`;
    resEl.classList.add('show');
    return;
  }
  resEl.innerHTML = hits.map((h,i)=>`
    <div class="result" data-i="${i}">
      <b>${h.roomId}</b><span>${h.r.label || ''}</span><span class="bld">${h.where}</span>
    </div>`).join('');
  resEl.classList.add('show');
  activeResult = 0;
  [...resEl.querySelectorAll('.result[data-i]')].forEach(el=>{
    el.onclick = ()=>{
      const h = hits[+el.dataset.i];
      gotoHit(h);
    };
  });
}
function gotoHit(h){
  S.view = h.bId; S.floor = h.floor;
  S.selected = { bId:h.bId, floor:h.floor, roomId:h.roomId };
  S.route = planRoute(h.bId, h.floor, h.roomId, S.start);
  resEl.classList.remove('show');
  qEl.blur();
  render();
  window.scrollTo({ top:0, behavior:'smooth' });
}
qEl.addEventListener('input', e=>doSearch(e.target.value));
qEl.addEventListener('focus', e=>{ if (e.target.value.trim()) doSearch(e.target.value); });
qEl.addEventListener('keydown', e=>{
  const items = [...resEl.querySelectorAll('.result[data-i]')];
  if (e.key === 'Escape'){ resEl.classList.remove('show'); return; }
  if (!items.length) return;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){
    e.preventDefault();
    activeResult = (activeResult + (e.key==='ArrowDown'?1:-1) + items.length) % items.length;
    items.forEach((el,i)=>el.classList.toggle('active', i===activeResult));
  }
  if (e.key === 'Enter'){
    e.preventDefault();
    const el = items[Math.max(0, activeResult)];
    if (el) el.click();
  }
});
document.addEventListener('click', e=>{
  if (!e.target.closest('.searchwrap')) resEl.classList.remove('show');
});

        const target = BUILDINGS[b].floors[S.floor].rooms.find(r => r.id === rm);
        if (target){
          S.selected = { bId:b, floor:S.floor, roomId:rm };
          S.route = planRoute(b, S.floor, rm, S.start);
        }
      }
    } else if (rm){
      const hit = INDEX.find(i => i.roomId.toLowerCase() === rm.toLowerCase());
      if (hit){
        S.view = hit.bId; S.floor = hit.floor;
        S.selected = { bId:hit.bId, floor:hit.floor, roomId:hit.roomId };
        S.route = planRoute(hit.bId, hit.floor, hit.roomId, S.start);
      }
    }
  }catch(e){ /* ignore */ }
})();

render();
</script>
</body>
</html>
