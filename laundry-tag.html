<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>选择水洗标 · 洗衣小助手</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .tag-wrap { max-width: 820px; margin: 0 auto; padding: 0 16px 80px; }
    .tag-wrap h1 { font-size: 26px; color: #1a3a6b; margin: 28px 0 8px; }
    .tag-wrap .sub { color: #6b7a92; font-size: 14.5px; margin: 0 0 28px; line-height: 1.7; }

    .tag-group { margin-bottom: 30px; }
    .tag-group h3 {
      font-size: 15px;
      color: #2c3e5c;
      margin: 0 0 14px;
      padding-left: 12px;
      border-left: 3px solid #3b7ddd;
    }
    .symbol-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }
    .symbol-item {
      background: #fff;
      border: 2px solid #e8edf5;
      border-radius: 14px;
      padding: 14px 8px;
      text-align: center;
      cursor: pointer;
      transition: all .18s;
      user-select: none;
    }
    .symbol-item:hover { border-color: #b8cdf0; }
    .symbol-item.selected {
      border-color: #3b7ddd;
      background: #f0f6ff;
      box-shadow: 0 4px 14px rgba(59,125,221,.18);
    }
    .symbol-item svg {
      width: 48px;
      height: 48px;
      display: block;
      margin: 0 auto 8px;
      stroke: #2c3e5c;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .symbol-item.selected svg { stroke: #3b7ddd; }
    .symbol-item span {
      font-size: 12.5px;
      color: #5a6a85;
      line-height: 1.3;
      display: block;
    }

    .tag-actions {
      position: sticky;
      bottom: 0;
      background: linear-gradient(to top, #fff 70%, rgba(255,255,255,0));
      padding: 18px 0 8px;
      margin-top: 10px;
    }
    .tag-actions button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #3b7ddd, #2b5fc4);
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(59,125,221,.3);
    }
    .tag-actions button:disabled {
      background: #c8d3e2;
      box-shadow: none;
      cursor: not-allowed;
    }
    .picked-hint {
      text-align: center;
      font-size: 13px;
      color: #8a97ab;
      margin-bottom: 10px;
    }

    @media (max-width: 600px) {
      .symbol-grid { grid-template-columns: repeat(3, 1fr); gap: 8px; }
      .symbol-item svg { width: 40px; height: 40px; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="laundry.html">← 返回洗衣小助手</a>
    </div>
  </header>

  <main class="page">
    <div class="tag-wrap">
      <h1>选出和你衣服标签上一样的图标</h1>
      <p class="sub">每个分类最多选 1 个。选好后点底部按钮查看洗涤建议。图标含义参照国标 GB/T 8685。</p>

      <!-- 组 1：洗涤温度 -->
      <div class="tag-group">
        <h3>1. 水洗温度</h3>
        <div class="symbol-grid" data-group="wash">
          <div class="symbol-item" data-val="wash-30">
            <svg viewBox="0 0 64 64">
              <path d="M12 28 L22 14 H42 L52 28 V52 H12 Z"/>
              <path d="M20 32 Q26 26 32 32 Q38 38 44 32" stroke-width="2.2"/>
              <text x="32" y="47" text-anchor="middle" font-size="11" stroke="none" fill="#2c3e5c" font-weight="700">30</text>
            </svg>
            <span>30℃ 水洗</span>
          </div>
          <div class="symbol-item" data-val="wash-40">
            <svg viewBox="0 0 64 64">
              <path d="M12 28 L22 14 H42 L52 28 V52 H12 Z"/>
              <path d="M20 32 Q26 26 32 32 Q38 38 44 32" stroke-width="2.2"/>
              <text x="32" y="47" text-anchor="middle" font-size="11" stroke="none" fill="#2c3e5c" font-weight="700">40</text>
            </svg>
            <span>40℃ 水洗</span>
          </div>
          <div class="symbol-item" data-val="wash-60">
            <svg viewBox="0 0 64 64">
              <path d="M12 28 L22 14 H42 L52 28 V52 H12 Z"/>
              <path d="M20 32 Q26 26 32 32 Q38 38 44 32" stroke-width="2.2"/>
              <text x="32" y="47" text-anchor="middle" font-size="11" stroke="none" fill="#2c3e5c" font-weight="700">60</text>
            </svg>
            <span>60℃ 水洗</span>
          </div>
          <div class="symbol-item" data-val="wash-nd">
            <svg viewBox="0 0 64 64">
              <path d="M12 28 L22 14 H42 L52 28 V52 H12 Z"/>
              <path d="M20 32 Q26 26 32 32 Q38 38 44 32" stroke-width="2.2"/>
              <text x="32" y="47" text-anchor="middle" font-size="9" stroke="none" fill="#2c3e5c" font-weight="700">不可</text>
            </svg>
            <span>不可水洗</span>
          </div>
        </div>
      </div>

      <!-- 组 2：漂白 -->
      <div class="tag-group">
        <h3>2. 漂白</h3>
        <div class="symbol-grid" data-group="bleach">
          <div class="symbol-item" data-val="bleach-ok">
            <svg viewBox="0 0 64 64">
              <path d="M32 10 L52 46 H12 Z"/>
              <path d="M22 40 L32 22 L42 40" stroke-width="1.8"/>
            </svg>
            <span>可漂白</span>
          </div>
          <div class="symbol-item" data-val="bleach-oxy">
            <svg viewBox="0 0 64 64">
              <path d="M32 10 L52 46 H12 Z"/>
              <path d="M22 40 L32 22 L42 40" stroke-width="1.8"/>
              <circle cx="32" cy="34" r="3" fill="#2c3e5c" stroke="none"/>
            </svg>
            <span>仅氧漂</span>
          </div>
          <div class="symbol-item" data-val="bleach-no">
            <svg viewBox="0 0 64 64">
              <path d="M32 10 L52 46 H12 Z"/>
              <path d="M22 40 L32 22 L42 40" stroke-width="1.8"/>
              <line x1="16" y1="12" x2="48" y2="48" stroke-width="2.4"/>
            </svg>
            <span>不可漂白</span>
          </div>
        </div>
      </div>

      <!-- 组 3：晾晒 -->
      <div class="tag-group">
        <h3>3. 晾晒方式</h3>
        <div class="symbol-grid" data-group="dry">
          <div class="symbol-item" data-val="dry-natural">
            <svg viewBox="0 0 64 64">
              <rect x="12" y="12" width="40" height="40" rx="4"/>
              <path d="M20 32 H44" stroke-width="2.2"/>
            </svg>
            <span>悬挂晾干</span>
          </div>
          <div class="symbol-item" data-val="dry-flat">
            <svg viewBox="0 0 64 64">
              <rect x="12" y="12" width="40" height="40" rx="4"/>
              <path d="M20 24 H44 M20 36 H44" stroke-width="2.2"/>
            </svg>
            <span>平摊晾干</span>
          </div>
          <div class="symbol-item" data-val="dry-shade">
            <svg viewBox="0 0 64 64">
              <rect x="12" y="12" width="40" height="40" rx="4"/>
              <path d="M20 32 H44" stroke-width="2.2"/>
              <path d="M18 18 L46 18" stroke-width="1.6" stroke-dasharray="3 3"/>
            </svg>
            <span>阴凉晾干</span>
          </div>
          <div class="symbol-item" data-val="dry-tumbler">
            <svg viewBox="0 0 64 64">
              <rect x="12" y="12" width="40" height="40" rx="4"/>
              <circle cx="32" cy="32" r="7"/>
            </svg>
            <span>可烘干</span>
          </div>
        </div>
      </div>

      <!-- 组 4：熨烫 -->
      <div class="tag-group">
        <h3>4. 熨烫</h3>
        <div class="symbol-grid" data-group="iron">
          <div class="symbol-item" data-val="iron-low">
            <svg viewBox="0 0 64 64">
              <path d="M14 40 H50 Q48 24 32 24 H22 L16 32 Z"/>
              <circle cx="32" cy="33" r="2.4" fill="#2c3e5c" stroke="none"/>
            </svg>
            <span>低温熨烫</span>
          </div>
          <div class="symbol-item" data-val="iron-mid">
            <svg viewBox="0 0 64 64">
              <path d="M14 40 H50 Q48 24 32 24 H22 L16 32 Z"/>
              <circle cx="28" cy="33" r="2.4" fill="#2c3e5c" stroke="none"/>
              <circle cx="36" cy="33" r="2.4" fill="#2c3e5c" stroke="none"/>
            </svg>
            <span>中温熨烫</span>
          </div>
          <div class="symbol-item" data-val="iron-no">
            <svg viewBox="0 0 64 64">
              <path d="M14 40 H50 Q48 24 32 24 H22 L16 32 Z"/>
              <line x1="16" y1="14" x2="48" y2="48" stroke-width="2.4"/>
            </svg>
            <span>不可熨烫</span>
          </div>
        </div>
      </div>

      <div class="tag-actions">
        <p class="picked-hint" id="pickedHint">尚未选择</p>
        <button id="confirmBtn" disabled>查看洗涤建议</button>
      </div>

    </div>
  </main>

  <script src="js/common.js"></script>
  <script>
    var picked = {};
    var items  = document.querySelectorAll('.symbol-item');
    var hint   = document.getElementById('pickedHint');
    var btn    = document.getElementById('confirmBtn');

    items.forEach(function (item) {
      item.addEventListener('click', function () {
        var group = item.parentNode.getAttribute('data-group');
        var val   = item.getAttribute('data-val');

        // 同组内互斥
        item.parentNode.querySelectorAll('.symbol-item').forEach(function (s) {
          if (s !== item) s.classList.remove('selected');
        });

        if (item.classList.contains('selected')) {
          item.classList.remove('selected');
          delete picked[group];
        } else {
          item.classList.add('selected');
          picked[group] = val;
        }
        updateUI();
      });
    });

    function updateUI() {
      var n = Object.keys(picked).length;
      if (n === 0) {
        hint.textContent = '尚未选择';
        btn.disabled = true;
      } else {
        hint.textContent = '已选择 ' + n + ' 项';
        btn.disabled = false;
      }
    }

    btn.addEventListener('click', function () {
      // 把选择结果存到 localStorage，结果页读取
      localStorage.setItem('laundryMode', 'tag');
      localStorage.setItem('laundryTag', JSON.stringify(picked));
      localStorage.removeItem('laundryQuiz');
      location.href = 'laundry-result.html';
    });
  </script>
</body>
</html>
