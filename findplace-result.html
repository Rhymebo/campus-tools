<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>教室位置 · 快速找教室</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .res-head {
      max-width: 1100px;
      margin: 0 auto;
      padding: 30px 16px 20px;
    }
    .res-head h1 {
      font-size: 24px;
      color: #1a3a6b;
      margin: 0 0 8px;
    }
    .res-head .target {
      font-size: 14.5px;
      color: #4a5b73;
    }
    .res-head .target b {
      color: #3b7ddd;
      font-size: 17px;
    }

    /* 左右两栏 */
    .map-layout {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 16px 70px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 22px;
    }
    .map-panel {
      background: #fff;
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 4px 20px rgba(20,40,80,.07);
      display: flex;
      flex-direction: column;
    }
    .map-panel h2 {
      font-size: 15px;
      color: #2c3e5c;
      margin: 0 0 4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .map-panel h2 .tag {
      font-size: 11.5px;
      font-weight: 600;
      color: #3b7ddd;
      background: #eef5ff;
      padding: 3px 9px;
      border-radius: 20px;
    }
    .map-panel .panel-sub {
      font-size: 12.5px;
      color: #94a1b5;
      margin: 0 0 14px;
    }

    .svg-box {
      background: #f7f9fc;
      border-radius: 12px;
      overflow: hidden;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
    }
    .svg-box svg {
      width: 100%;
      height: auto;
      display: block;
    }

    /* SVG 内部样式 */
    .bld {
      fill: #e8eef8;
      stroke: #c3d3ea;
      stroke-width: 2;
      transition: all .25s;
    }
    .bld.target {
      fill: #cfe0fb;
      stroke: #3b7ddd;
      stroke-width: 3;
    }
    .bld-label {
      font-size: 13px;
      fill: #5a6a85;
      font-weight: 600;
      text-anchor: middle;
      pointer-events: none;
    }
    .bld-label.target { fill: #1a3a6b; }
    .entry {
      fill: #ff8a4c;
      stroke: #fff;
      stroke-width: 2;
      transition: all .25s;
    }
    .entry.target {
      fill: #d33a2c;
      animation: pulse 1.4s infinite;
    }
    .entry-label {
      font-size: 11.5px;
      fill: #c6440f;
      font-weight: 700;
      text-anchor: middle;
      pointer-events: none;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%      { opacity: .45; }
    }

    .room-cell {
      fill: #fff;
      stroke: #dde3ec;
      stroke-width: 1.5;
      transition: all .2s;
    }
    .room-cell.target {
      fill: #ffd8c2;
      stroke: #d33a2c;
      stroke-width: 3;
    }
    .floor-label {
      font-size: 13px;
      fill: #8a97ab;
      font-weight: 600;
    }
    .room-label {
      font-size: 12.5px;
      fill: #8a97ab;
      text-anchor: middle;
      pointer-events: none;
    }
    .room-label.target {
      fill: #b3321f;
      font-weight: 800;
      font-size: 15px;
    }

    /* 提示条 */
    .legend {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
      margin-top: 14px;
      font-size: 12.5px;
      color: #6b7a92;
    }
    .legend i {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 3px;
      margin-right: 6px;
      vertical-align: -1px;
    }

    .notfound {
      text-align: center;
      padding: 70px 20px;
      color: #8a97ab;
      line-height: 1.9;
    }

    .back-row {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 16px 60px;
      display: flex;
      gap: 12px;
    }
    .back-row a {
      flex: 1;
      text-align: center;
      padding: 14px;
      border-radius: 12px;
      text-decoration: none;
      font-size: 15px;
      font-weight: 700;
      transition: all .18s;
    }
    .btn-primary {
      background: linear-gradient(135deg, #3b7ddd, #2b5fc4);
      color: #fff;
      box-shadow: 0 4px 14px rgba(59,125,221,.3);
    }
    .btn-ghost {
      background: #fff;
      color: #3b7ddd;
      border: 2px solid #d5e2f5;
    }

    @media (max-width: 820px) {
      .map-layout { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="findplace.html">← 重新查找</a>
    </div>
  </header>

  <main class="page">
    <div class="res-head" id="resHead">
      <h1>位置已找到</h1>
      <p class="target" id="targetInfo"></p>
    </div>

    <div class="map-layout" id="mapLayout">
      <!-- 左：校园地图 -->
      <div class="map-panel">
        <h2>校园总览 <span class="tag">楼栋入口</span></h2>
        <p class="panel-sub">橙色标记是楼栋入口，找到它再进楼。</p>
        <div class="svg-box">
          <svg id="campusSvg" viewBox="0 0 520 380">
            <!-- 道路 -->
            <line x1="0" y1="200" x2="520" y2="200" stroke="#dde3ec" stroke-width="26"/>
            <line x1="260" y1="0" x2="260" y2="380" stroke="#dde3ec" stroke-width="20"/>
            <!-- 楼栋由 JS 注入 -->
            <g id="campusBuildings"></g>
            <!-- 入口由 JS 注入 -->
            <g id="campusEntries"></g>
          </svg>
        </div>
        <div class="legend">
          <span><i style="background:#cfe0fb;border:2px solid #3b7ddd;"></i>目标楼栋</span>
          <span><i style="background:#d33a2c;"></i>楼栋入口</span>
        </div>
      </div>

      <!-- 右：楼层地图 -->
      <div class="map-panel">
        <h2>楼层平面 <span class="tag" id="floorTag">—</span></h2>
        <p class="panel-sub">红色高亮格子就是你去的教室。</p>
        <div class="svg-box">
          <svg id="floorSvg" viewBox="0 0 520 380">
            <g id="floorContent"></g>
          </svg>
        </div>
        <div class="legend">
          <span><i style="background:#ffd8c2;border:2px solid #d33a2c;"></i>目标教室</span>
        </div>
      </div>
    </div>

    <div class="back-row">
      <a class="btn-ghost" href="findplace.html">重新查找</a>
      <a class="btn-primary" href="index.html">回首页</a>
    </div>
  </main>

  <script src="js/common.js"></script>
  <script>
    // ===== 校园建筑数据（与输入页保持一致） =====
    var CAMPUS = {
      '明德楼':  { maxFloor: 5, x: 120, y: 90,  w: 110, h: 70 },
      '图书馆':  { maxFloor: 4, x: 300, y: 80,  w: 100, h: 80 },
      '实验楼':  { maxFloor: 4, x: 130, y: 240, w: 110, h: 70 },
      '教学楼':  { maxFloor: 6, x: 310, y: 240, w: 120, h: 80 }
    };

    var target = JSON.parse(localStorage.getItem('targetRoom') || 'null');

    if (!target || !CAMPUS[target.building]) {
      document.getElementById('mapLayout').innerHTML =
        '<div class="notfound">没有找到查找记录。<br><a href="findplace.html" style="color:#3b7ddd;font-weight:700;">返回重新输入</a></div>';
      document.getElementById('targetInfo').textContent = '';
      throw new Error('no target');
    }

    var bInfo = CAMPUS[target.building];

    document.getElementById('targetInfo').innerHTML =
      '目标教室：<b>' + target.building + ' ' + target.room + '</b>（第 ' + target.floor + ' 层）';
    document.getElementById('floorTag').textContent = bInfo.maxFloor + ' 层楼';

    // ===== 1. 校园图：画楼栋 =====
    var gBld = document.getElementById('campusBuildings');
    Object.keys(CAMPUS).forEach(function (name) {
      var b = CAMPUS[name];
      var isTarget = (name === target.building);

      var rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      rect.setAttribute('x', b.x);
      rect.setAttribute('y', b.y);
      rect.setAttribute('width', b.w);
      rect.setAttribute('height', b.h);
      rect.setAttribute('rx', 6);
      rect.setAttribute('class', 'bld' + (isTarget ? ' target' : ''));
      gBld.appendChild(rect);

      var txt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      txt.setAttribute('x', b.x + b.w / 2);
      txt.setAttribute('y', b.y + b.h / 2 + 5);
      txt.setAttribute('class', 'bld-label' + (isTarget ? ' target' : ''));
      txt.textContent = name;
      gBld.appendChild(txt);
    });

    // ===== 2. 校园图：目标楼栋入口 =====
    var gEntry = document.getElementById('campusEntries');
    var ex = bInfo.x + bInfo.w / 2;
    var ey = bInfo.y + bInfo.h;   // 楼栋下边缘

    var entryCircle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    entryCircle.setAttribute('cx', ex);
    entryCircle.setAttribute('cy', ey + 14);
    entryCircle.setAttribute('r', 9);
    entryCircle.setAttribute('class', 'entry target');
    gEntry.appendChild(entryCircle);

    var entryTxt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    entryTxt.setAttribute('x', ex);
    entryTxt.setAttribute('y', ey + 42);
    entryTxt.setAttribute('class', 'entry-label');
    entryTxt.textContent = '入口';
    gEntry.appendChild(entryTxt);

    // ===== 3. 楼层图：根据楼层画教室格 =====
    var floorContent = document.getElementById('floorContent');
    var roomsPerFloor = 8;   // 每层几个教室

    // 楼层标题
    var fTitle = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    fTitle.setAttribute('x', 20);
    fTitle.setAttribute('y', 40);
    fTitle.setAttribute('class', 'floor-label');
    fTitle.textContent = target.building + ' · 第 ' + target.floor + ' 层';
    floorContent.appendChild(fTitle);

    // 走廊
    var corridor = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    corridor.setAttribute('x', 30);
    corridor.setAttribute('y', 170);
    corridor.setAttribute('width', 460);
    corridor.setAttribute('height', 40);
    corridor.setAttribute('fill', '#eef2f8');
    corridor.setAttribute('rx', 4);
    floorContent.appendChild(corridor);

    var corrTxt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    corrTxt.setAttribute('x', 260);
    corrTxt.setAttribute('y', 195);
    corrTxt.setAttribute('text-anchor', 'middle');
    corrTxt.setAttribute('font-size', '12');
    corrTxt.setAttribute('fill', '#94a1b5');
    corrTxt.textContent = '走廊';
    floorContent.appendChild(corrTxt);

    // 教室：上排 4 个 + 下排 4 个
    var roomW = 100, roomH = 95, gap = 20;
    var startX = 30;
    var topY = 60;
    var botY = 225;

    for (var i = 1; i <= roomsPerFloor; i++) {
      var roomNo = target.floor + '0' + i;         // 如 302 = 第3层02号
      var isTop  = i <= 4;
      var idx    = isTop ? (i - 1) : (i - 5);
      var x = startX + idx * (roomW + gap);
      var y = isTop ? topY : botY;
      var isTarget = (roomNo === target.room);

      var cell = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      cell.setAttribute('x', x);
      cell.setAttribute('y', y);
      cell.setAttribute('width', roomW);
      cell.setAttribute('height', roomH);
      cell.setAttribute('rx', 8);
      cell.setAttribute('class', 'room-cell' + (isTarget ? ' target' : ''));
      floorContent.appendChild(cell);

      var lbl = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      lbl.setAttribute('x', x + roomW / 2);
      lbl.setAttribute('y', y + roomH / 2 + 5);
      lbl.setAttribute('class', 'room-label' + (isTarget ? ' target' : ''));
      lbl.textContent = roomNo;
      floorContent.appendChild(lbl);
    }
  </script>
</body>
</html>
