<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>洗涤建议 · 洗衣小助手</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .res-wrap { max-width: 720px; margin: 0 auto; padding: 0 16px 80px; }
    .res-wrap h1 { font-size: 26px; color: #1a3a6b; margin: 28px 0 6px; }
    .res-source {
      display: inline-block;
      font-size: 12.5px;
      color: #3b7ddd;
      background: #eef5ff;
      padding: 5px 12px;
      border-radius: 20px;
      margin-bottom: 24px;
    }

    .advice-card {
      background: #fff;
      border-radius: 16px;
      padding: 22px 24px;
      box-shadow: 0 4px 18px rgba(20,40,80,.06);
      margin-bottom: 14px;
      display: flex;
      gap: 16px;
      align-items: flex-start;
    }
    .advice-icon {
      font-size: 26px;
      line-height: 1.2;
      flex-shrink: 0;
      width: 38px;
      text-align: center;
    }
    .advice-body h3 {
      font-size: 15px;
      color: #1a3a6b;
      margin: 0 0 8px;
    }
    .advice-body p {
      font-size: 14.5px;
      color: #4a5b73;
      line-height: 1.75;
      margin: 0;
    }
    .advice-body b { color: #3b7ddd; }

    .warn-card {
      background: #fff7f2;
      border: 1.5px solid #ffd9c4;
    }
    .warn-card .advice-body h3 { color: #c6440f; }
    .warn-card .advice-body b { color: #c6440f; }

    .res-actions {
      display: flex;
      gap: 12px;
      margin-top: 28px;
    }
    .res-actions a {
      flex: 1;
      text-align: center;
      padding: 14px;
      border-radius: 12px;
      text-decoration: none;
      font-size: 15px;
      font-weight: 700;
      transition: all .18s;
    }
    .btn-primary {
      background: linear-gradient(135deg, #3b7ddd, #2b5fc4);
      color: #fff;
      box-shadow: 0 4px 14px rgba(59,125,221,.3);
    }
    .btn-ghost {
      background: #fff;
      color: #3b7ddd;
      border: 2px solid #d5e2f5;
    }
    .empty-tip {
      text-align: center;
      padding: 60px 20px;
      color: #8a97ab;
      font-size: 15px;
      line-height: 1.8;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="laundry.html">← 返回洗衣小助手</a>
    </div>
  </header>

  <main class="page">
    <div class="res-wrap">
      <h1>洗涤建议</h1>
      <span class="res-source" id="resSource">—</span>

      <div id="adviceList"></div>

      <div class="res-actions">
        <a class="btn-ghost" href="laundry.html">重新选择</a>
        <a class="btn-primary" href="index.html">回首页</a>
      </div>
    </div>
  </main>

  <script src="js/common.js"></script>
  <script>
    var mode = localStorage.getItem('laundryMode');
    var list = document.getElementById('adviceList');
    var src  = document.getElementById('resSource');

    // 标签图标 → 建议文案，键名与 laundry-tag.html 的 data-val 一一对应
    var TAG_ADVICE = {
      // 水洗
      'wash-30':   { icon:'🌡️', title:'水温 ≤30℃', text:'用冷水和中性洗涤剂，避免热水导致缩水、掉色。' },
      'wash-40':   { icon:'🌡️', title:'水温 ≤40℃', text:'温水洗涤更易去污，手洗或常规机洗都可以。' },
      'wash-60':   { icon:'🌡️', title:'水温 ≤60℃', text:'适合棉麻等耐热织物，可杀菌去油；深色和易掉色衣物分开洗。' },
      'wash-95':   { icon:'🌡️', title:'可高温煮洗（≤95℃）', text:'只适合白色棉麻、毛巾、床单等特别耐热的织物，化纤、羊毛、真丝绝不能用。' },
      'wash-hand': { icon:'🤲', title:'只能手洗（≤40℃）', text:'轻柔按压洗涤，不要机洗、不要搓揉拧绞；洗后用毛巾压干水分。' },
      'wash-no':   { icon:'🚫', title:'不可水洗', text:'不能自己泡水洗，需要干洗或专业护理；局部污渍用湿布轻擦。', warn:true },

      // 漂白
      'bleach-any': { icon:'🧴', title:'可以使用含氯漂白剂', text:'84 消毒液等可以用，但彩色衣物先在不显眼处测试，避免褪色。' },
      'bleach-oxy': { icon:'🧴', title:'只能用氧漂（彩漂）', text:'不能用 84 等含氯漂白剂，可用彩漂、过碳酸钠类氧漂产品。' },
      'bleach-no':  { icon:'🚫', title:'不可漂白', text:'任何漂白剂都不要用，包括 84 消毒液和彩漂。', warn:true },

      // 干衣机
      'tumble-any':  { icon:'🌀', title:'可以使用干衣机', text:'可以正常滚筒烘干，按衣物材质选择对应程序。' },
      'tumble-low':  { icon:'🌀', title:'只能低温烘干', text:'用低温档烘干，防止缩水和面料损伤；不确定时自然晾干更稳。' },
      'tumble-high': { icon:'🌀', title:'可以用高温烘干', text:'适合棉麻等耐热织物，注意不要烘过头，避免发硬起皱。' },
      'tumble-no':   { icon:'🚫', title:'不可烘干', text:'不能进烘干机，只能自然晾干，热风会造成缩水或变形。', warn:true },

      // 自然干燥
      'dry-line':   { icon:'🌿', title:'悬挂晾干', text:'用衣架或晾衣绳挂在通风处自然晾干。' },
      'dry-flat':   { icon:'🌿', title:'平摊晾干', text:'针织、毛衣等要平铺晾干，挂着会被重力拉长变形。' },
      'dry-shade':  { icon:'🌤️', title:'阴凉处晾干', text:'避开阳光直晒，放在通风阴凉处，减少褪色和面料老化。' },
      'dry-drip':   { icon:'💧', title:'滴干', text:'洗后不要脱水，直接挂起滴水晾干，适合容易起皱的衣物。' },
      'dry-nowring':{ icon:'🚫', title:'不可拧干', text:'不要拧绞，用手轻压或用毛巾卷起吸水，防止变形。', warn:true },

      // 熨烫
      'iron-low':  { icon:'♨️', title:'低温熨烫（≤110℃）', text:'适合真丝、羊毛、化纤，最好垫一层布再熨。' },
      'iron-mid':  { icon:'♨️', title:'中温熨烫（≤150℃）', text:'适合棉、涤棉，可稍加蒸汽，熨斗不要长时间停在一处。' },
      'iron-high': { icon:'♨️', title:'高温熨烫（≤200℃）', text:'适合棉麻，可先喷湿或垫布；深色衣物垫布防止亮痕。' },
      'iron-no':   { icon:'🚫', title:'不可熨烫', text:'熨烫会导致变形或留下亮痕，不要用熨斗。', warn:true },

      // 专业护理
      'clean-p':  { icon:'🧼', title:'可常规干洗（P）', text:'可送干洗店，使用四氯乙烯或碳氢溶剂常规干洗。' },
      'clean-f':  { icon:'🧼', title:'仅石油溶剂干洗（F）', text:'干洗时只能用石油类溶剂，温和处理，送店时提醒店员。' },
      'clean-w':  { icon:'💧', title:'可专业湿洗（W）', text:'可以送专业店做湿洗，不是普通在家水洗。' },
      'clean-no': { icon:'🚫', title:'不可干洗', text:'不能送干洗，按水洗符号处理。', warn:true }
    };
    var GROUP_ORDER = ['wash', 'bleach', 'tumble', 'dry', 'iron', 'clean'];

    // ===== 核心：根据模式生成建议 =====
    function buildAdvice() {
      var advice = [];

      if (mode === 'tag') {
        var tag = {};
        try {
          tag = JSON.parse(localStorage.getItem('laundryTag') || '{}');
        } catch (e) {
          tag = {};
        }
        var validKeys = GROUP_ORDER.filter(function (g) {
          return tag[g] && TAG_ADVICE[tag[g]];
        });
        if (validKeys.length === 0) return null;
        src.textContent = '依据：你选择的 ' + validKeys.length + ' 个洗护图标';

        // 按固定顺序输出
        GROUP_ORDER.forEach(function (g) {
          var v = tag[g];
          if (v && TAG_ADVICE[v]) advice.push(TAG_ADVICE[v]);
        });

        // 组合提醒
        if (tag.wash === 'wash-no' && tag.clean === 'clean-no') {
          advice.push({
            icon:'⚠️',
            title:'标签说明不能水洗也不能干洗',
            text:'这种情况比较少见，建议直接送专业洗衣店，让店员确认处理方式，不要自己尝试。',
            warn:true
          });
        }
        if (tag.wash === 'wash-hand' && tag.tumble && tag.tumble !== 'tumble-no') {
          advice.push({
            icon:'⚠️',
            title:'手洗衣物不建议机烘',
            text:'只能手洗通常意味着面料怕翻滚和高温，洗后压干水分、平铺阴干更安全。',
            warn:true
          });
        }
        if (tag.wash === 'wash-95' && tag.iron && tag.iron !== 'iron-no') {
          advice.push({
            icon:'ℹ️',
            title:'耐煮洗不等于耐高温熨烫',
            text:'洗涤温度高不代表熨烫也能用高温，熨烫仍按熨斗符号的点数来。'
          });
        }
        if (advice.length === 0) {
          advice.push({ icon:'ℹ️', title:'未读取到有效标签', text:'你选择的图标没有对应建议，建议返回重新选择。' });
        }
      }

      if (mode === 'quiz') {
        var q = JSON.parse(localStorage.getItem('laundryQuiz') || '{}');
        if (!q.fabric) return null;
        src.textContent = '依据：你的 4 个回答';

        var base = {
          cotton:    { temp:'≤40℃ 温水', prog:'常规机洗或手洗', extra:'冷水洗可减少缩水和掉色' },
          wool:      { temp:'≤30℃ 冷水', prog:'羊毛/轻柔程序',   extra:'千万别搓揉，会起球缩水' },
          silk:      { temp:'≤30℃ 冷水', prog:'手洗，轻柔按压',   extra:'不要拧绞，用毛巾吸干' },
          synthetic: { temp:'≤40℃ 温水', prog:'常规机洗',        extra:'不要高温，容易变形' },
          unknown:   { temp:'≤30℃ 冷水', prog:'最轻柔模式',      extra:'不确定的情况下越温和越安全' }
        }[q.fabric];

        advice.push({ icon:'💧', title:'水温与程序：' + base.temp, text:'推荐使用「' + base.prog + '」。' + base.extra + '。' });

        if (q.decor === 'print')  advice.push({ icon:'🎨', title:'翻面洗', text:'印花、烫画、刺绣朝内洗，避免摩擦脱落。不要用刷子刷图案。' });
        if (q.decor === 'bead')   advice.push({ icon:'✨', title:'装洗衣袋', text:'水钻、亮片一定要装进洗衣袋，防止掉钻和刮伤其他衣服。建议手洗。' });
        if (q.decor === 'zipper') advice.push({ icon:'🔗', title:'拉好拉链', text:'拉链拉到底、扣子扣好再洗，避免勾破面料。金属件最好包一层布。' });

        if (q.color === 'light')      advice.push({ icon:'⚪', title:'浅色分开洗', text:'浅色单独洗，别和深色混，否则会被染色。' });
        if (q.color === 'dark')       advice.push({ icon:'⚫', title:'深色单独洗', text:'深色第一次洗可能掉色，建议单独洗，冷水洗，反面晾晒。' });
        if (q.color === 'multicolor') advice.push({ icon:'🌈', title:'拼色小心', text:'拼色衣服容易互相串色，建议冷水快洗，不要浸泡。' });

        if (q.fit === 'slim')       advice.push({ icon:'📏', title:'不要热水、不要甩太干', text:'紧身弹力衣物用温水和轻柔模式，脱水时间短一点，防止变形。' });
        if (q.fit === 'structured') advice.push({ icon:'🧥', title:'建议少洗、送干洗', text:'有硬挺结构的衣服水洗容易变形塌陷，尽量局部清洁或送干洗。' });
        if (q.fit === 'loose')      advice.push({ icon:'🌿', title:'晾晒注意形状', text:'宽松衣服悬挂晾干时整理好肩线和下摆，防止挂着变形。' });

        if (q.fabric === 'wool' || q.fabric === 'silk') {
          advice.push({ icon:'⚠️', title:'这两个面料要特别当心', text:'羊毛和真丝都怕热水、怕搓揉、怕拧绞。建议手洗，用毛巾压干后平铺阴干。', warn:true });
        }
        if (q.decor === 'bead' && q.fabric === 'silk') {
          advice.push({ icon:'⚠️', title:'建议还是送干洗', text:'真丝加亮片，手洗也有风险，比较贵的话建议干洗。', warn:true });
        }
      }

      return advice;
    }

    // ===== 渲染 =====
    var advice = buildAdvice();
    if (!advice) {
      list.innerHTML = '<div class="empty-tip">没有读取到你的选择数据。<br>请返回<a href="laundry.html" style="color:#3b7ddd;">重新选择</a>。</div>';
      src.textContent = '';
    } else {
      var html = '';
      advice.forEach(function (a) {
        html += '<div class="advice-card' + (a.warn ? ' warn-card' : '') + '">' +
                  '<div class="advice-icon">' + a.icon + '</div>' +
                  '<div class="advice-body">' +
                    '<h3>' + a.title + '</h3>' +
                    '<p>' + a.text + '</p>' +
                  '</div>' +
                '</div>';
      });
      list.innerHTML = html;
    }
</script>
</body>
</html>
